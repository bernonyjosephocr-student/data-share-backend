spring:
  application:
    name: data-share-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

server:
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: -1
    connection-timeout: 600000 # 10 minutes

security:
  jwt:
    # Provide a Base64-encoded random key of at least 32 bytes; keep it outside source control.
    secret-base64: ${JWT_SECRET_BASE64:V8etWJY19CdNrdHAH4HTjMm5xtQw8cO0j9/ctP1bxUo=}
    # Token lifetime in milliseconds (one hour by default).
    expiration-ms: ${JWT_EXPIRATION_MS:900000}

logging:
  level:
    root: INFO
    com.projet3.datasharing.backend: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

file:
  upload-dir: ${FILE_UPLOAD_DIR:./local-file-store}
  retention-day: 7
  max-file-size: 1GB
  forbidden-extensions: exe,bat,cmd,sh
storage:
  type: s3
  cleanup:
    #cron: "0 0 * * * *"
    cron: "0 */5 * * * *"
aws:
  s3:
    endpoint: http://localhost:9000
    bucket-name: my-shared-bucket
    access-key: minioadmin
    secret-key: minioadmin
    region: us-east-1

