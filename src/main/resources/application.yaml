spring:
  application:
    name: data-share-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

security:
  jwt:
    # Provide a Base64-encoded random key of at least 32 bytes; keep it outside source control.
    secret-base64: ${JWT_SECRET_BASE64}
    # Token lifetime in milliseconds (one hour by default).
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

file:
  upload-dir: ${FILE_UPLOAD_DIR:./local-file-store}