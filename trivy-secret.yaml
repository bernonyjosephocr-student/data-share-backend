rules:
  - id: generic-env-password
    category: general
    title: Generic Password or Secret in .env
    severity: HIGH
    path: .*\.env.*
    keywords:
      - password
      - pwd
      - secret
      - token
      - key
    regex: (?i)(?P<key>[a-z0-9_]*(password|pwd|secret|token|api_key)[a-z0-9_]*)\s*=\s*['"]?(?P<secret>[^\s'"]{4,})['"]?
